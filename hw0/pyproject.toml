[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs498-hw0"
version = "0.1.0"
description = "CS 498 HW0 student starter package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]
viz = ["imageio>=2.31", "matplotlib>=3.7", "opencv-python-headless>=4.8"]

[project.scripts]
cs498-hw0 = "cs498_hw0.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
